name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q
      # Commit messages, checked against the same six phrases as the file
      # contents below. The two guards drifted once: this one checked four
      # phrases while that one checked six, so two of the six were unguarded
      # in history. Widening it caught one commit immediately — run 36, and
      # the offender was the message announcing the widening, which quotes
      # two phrases as search terms. History is not rewritten in this
      # repository, so that one hash is allowlisted by full SHA and named in
      # docs/DECISIONS.md. Any other commit carrying any of the six fails,
      # including any future one.
      - name: Authorship
        run: |
          ALLOWED=04589de8bbf806912ad97b369d9caedce419bcbc
          PATTERN="co-authored|generated with|copilot|assisted by|ai assistance|with the help of"
          offenders=$(git rev-list HEAD | while read -r sha; do
            [ "$sha" = "$ALLOWED" ] && continue
            if git log -1 --format='%B' "$sha" | grep -iqE "$PATTERN"; then
              echo "$sha $(git log -1 --format='%s' "$sha")"
            fi
          done)
          if [ -n "$offenders" ]; then
            echo "authorship phrase in commit message:" >&2
            echo "$offenders" >&2
            exit 1
          fi
          echo "no authorship phrase in any commit message"
      # Model names are objects of study and are whitelisted. Excluded from
      # its own scan: this workflow file (it carries the search pattern) and
      # the public PAWS sample (a source sentence contains "with the help of").
      - name: Authorship file contents
        run: |
          if git grep -iE "co-authored|generated with|copilot|assisted by|ai assistance|with the help of" -- . ':!.github/workflows/ci.yml' ':!data/workload/paws_sample.csv' | grep -viE "deepseek-v4-flash|glm-5.3|all-minilm-l6-v2"; then
            echo "authorship statement found in tracked files" >&2
            exit 1
          fi
      - name: Audit docs
        run: uv run python scripts/audit_docs.py

  docker:
    runs-on: ubuntu-latest
    # Five times the slower of the two cold builds now measured (1m18s of
    # Build in run 36, 2m45s in run 37; neither restored a layer). The
    # previous ceiling of 35 minutes was sized for the buildx export path
    # removed below, whose worst observed Build was 20m44s; that
    # configuration no longer exists. The point of the ceiling is that a hung
    # build fails as a build, not as a mystery.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Plain `docker build` on the default daemon driver, measured against
      # the alternative rather than assumed. buildx's container driver with
      # `load: true` cannot write into the image store, so it exported the
      # 6.34 GB image to a tarball and re-imported it: 511.4s exporting plus
      # 150.1s importing in run 35. `cache-to: type=gha,mode=max` then spent
      # 650.7s uploading layers to save a 72.1s `uv sync` that the old COPY
      # order invalidated on every README edit anyway, so the only layers it
      # ever restored were WORKDIR and apt-get. Measured effect: run 33 took
      # 16m41s, run 35 took 21m25s, runs 36 and 37 under this configuration
      # took 1m32s and 2m59s with zero cached layers. The Dockerfile's
      # dependency layer is now keyed on uv.lock alone, so a host that keeps
      # an image store reuses it; an ephemeral runner rebuilds it in 34 to
      # 76 seconds.
      - name: Build
        run: docker build -t llm-gateway-bench:ci .
      - name: Start gateway
        run: |
          docker run -d --name gateway -p 8000:8000 \
            -e LGB_GATEWAY_BASE_URL=http://127.0.0.1:9/v1 \
            llm-gateway-bench:ci
      - name: Poll health and exercise keyless chat
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:8000/health | grep -q '"ok": *true'; then
              break
            fi
            sleep 2
          done
          curl -sf localhost:8000/health | grep -q '"ok": *true'
          code=$(curl -s -o /tmp/chat.json -w "%{http_code}" \
            -H 'Content-Type: application/json' \
            -d '{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"hi"}]}' \
            localhost:8000/v1/chat/completions)
          echo "chat status: $code"
          cat /tmp/chat.json
          test "$code" = "500"
          # The unconfigured-upstream error must name the variable to set,
          # in the response body and in the container log, not just say
          # "chat failed". README documents exactly this shape.
          grep -q '"param": *"LGB_GATEWAY_BASE_URL"' /tmp/chat.json
          grep -q '"type": *"upstream_unavailable"' /tmp/chat.json
          grep -q 'chat failed for deepseek-v4-flash' /tmp/chat.json
          docker logs gateway 2>&1 | grep -q "chat failed"
          docker logs gateway 2>&1 | grep -q "LGB_GATEWAY_BASE_URL"
      - name: Teardown
        if: always()
        run: docker rm -f gateway
