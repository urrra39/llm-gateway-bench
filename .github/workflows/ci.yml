name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q
      - name: Authorship
        run: |
          if git log --format='%B' | grep -iE "co-authored|generated with|copilot|assisted by"; then
            echo "authorship trailer found" >&2
            exit 1
          fi
      - name: Audit docs
        run: uv run python scripts/audit_docs.py
