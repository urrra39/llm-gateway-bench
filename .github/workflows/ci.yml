name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q
      - name: Authorship
        run: |
          # Same pattern as the file-contents guard below. The two drifted
          # once: this one checked four phrases while that one checked six,
          # so a message saying "with the help of" would have passed.
          if git log --format='%B' | grep -iE "co-authored|generated with|copilot|assisted by|ai assistance|with the help of"; then
            echo "authorship trailer found" >&2
            exit 1
          fi
      # Model names are objects of study and are whitelisted. Excluded from
      # its own scan: this workflow file (it carries the search pattern) and
      # the public PAWS sample (a source sentence contains "with the help of").
      - name: Authorship file contents
        run: |
          if git grep -iE "co-authored|generated with|copilot|assisted by|ai assistance|with the help of" -- . ':!.github/workflows/ci.yml' ':!data/workload/paws_sample.csv' | grep -viE "deepseek-v4-flash|glm-5.3|all-minilm-l6-v2"; then
            echo "authorship statement found in tracked files" >&2
            exit 1
          fi
      - name: Audit docs
        run: uv run python scripts/audit_docs.py

  docker:
    runs-on: ubuntu-latest
    # Stays above the worst cold build actually observed (20m44s of Build in
    # run 35, under the buildx export path removed below) until the new
    # configuration has a measurement of its own. The point of the ceiling is
    # that a hung build fails as a build, not as a mystery.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Plain `docker build` on the default daemon driver, measured against
      # the alternative rather than assumed. buildx's container driver with
      # `load: true` cannot write into the image store, so it exported the
      # 6.34 GB image to a tarball and re-imported it: 511.4s exporting plus
      # 150.1s importing in run 35. `cache-to: type=gha,mode=max` then spent
      # 650.7s uploading layers to save a 72.1s `uv sync` that the old COPY
      # order invalidated on every README edit anyway, so the only layers it
      # ever restored were WORKDIR and apt-get. Net effect of caching on this
      # repository: run 33 took 16m41s, run 35 took 21m25s. The Dockerfile's
      # dependency layer is now keyed on uv.lock alone, so the daemon reuses
      # it across builds on any host that keeps an image store; ephemeral
      # runners rebuild from scratch, which is two minutes of work, not
      # twenty of transfer.
      - name: Build
        run: docker build -t llm-gateway-bench:ci .
      - name: Start gateway
        run: |
          docker run -d --name gateway -p 8000:8000 \
            -e LGB_GATEWAY_BASE_URL=http://127.0.0.1:9/v1 \
            llm-gateway-bench:ci
      - name: Poll health and exercise keyless chat
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:8000/health | grep -q '"ok": *true'; then
              break
            fi
            sleep 2
          done
          curl -sf localhost:8000/health | grep -q '"ok": *true'
          code=$(curl -s -o /tmp/chat.json -w "%{http_code}" \
            -H 'Content-Type: application/json' \
            -d '{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"hi"}]}' \
            localhost:8000/v1/chat/completions)
          echo "chat status: $code"
          cat /tmp/chat.json
          test "$code" = "500"
          # The unconfigured-upstream error must name the variable to set,
          # in the response body and in the container log, not just say
          # "chat failed". README documents exactly this shape.
          grep -q '"param": *"LGB_GATEWAY_BASE_URL"' /tmp/chat.json
          grep -q '"type": *"upstream_unavailable"' /tmp/chat.json
          grep -q 'chat failed for deepseek-v4-flash' /tmp/chat.json
          docker logs gateway 2>&1 | grep -q "chat failed"
          docker logs gateway 2>&1 | grep -q "LGB_GATEWAY_BASE_URL"
      - name: Teardown
        if: always()
        run: docker rm -f gateway
