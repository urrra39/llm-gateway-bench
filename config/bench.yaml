gateway:
  base_url: http://127.0.0.1:8787/v1
  # The dev gateway on this machine needs no key. GSK_API_KEY is read when set.
  api_key_env: GSK_API_KEY
  timeout_s: 180
  concurrency: 4
  max_retries: 3

generation:
  temperature: 0.0
  # Large enough that reasoning + final content both fit: the gateway model emits
  # a chain of thought first, and a small budget is consumed entirely by
  # reasoning, leaving content empty.
  max_tokens: 4096
  reasoning_effort: low
  system_prompt: "Answer the request concisely, in at most three sentences. Do not refuse."
  # Cheap tier is a constrained operating point of the same model: one sentence
  # and 512 tokens. Measured 2026-09-17: brief answers use roughly half the
  # output tokens of full answers on the same request.
  cheap_max_tokens: 512
  cheap_system_prompt: "Answer in one sentence. Be brief. Do not refuse."

# Model pair verified 2026-09-17 by probing every model the gateway lists:
# claude-opus-4-8, claude-opus-5, gpt-5.6-sol, gpt-6-astra are budget-quota-blocked
# and glm-5.3 (the 2026-09-08 cheap tier) has no available channel. Only
# deepseek-v4-flash answers on both the OpenAI and Anthropic endpoints. Both
# tiers therefore use deepseek-v4-flash: the expensive tier is the full recipe
# (three sentences, 4096 tokens) and the cheap tier is the constrained recipe
# (one sentence, 512 tokens). The price table charges the same per-token rate
# for both tiers, so every reported dollar saving is a measured token saving,
# not a price assumption between vendors. The primary and secondary judges are
# the same model; kappa below therefore measures self-consistency, not
# inter-family agreement, and is labelled as such.
models:
  cheap: deepseek-v4-flash
  expensive: deepseek-v4-flash
  judge_primary: deepseek-v4-flash
  judge_secondary: deepseek-v4-flash

prices:
  currency: USD
  as_of: "2026-09-17"
  basis: >
    Assumed rate, not a provider quote. The dev gateway reports token usage
    but no price and no spend. The rate below is an input assumption for one
    model; the measured quantity is tokens, and every dollar figure is this
    table applied to those tokens. Both tiers share the rate because both tiers
    are the same model since 2026-09-17. Replace the table before quoting
    dollar savings elsewhere.
  per_million_tokens:
    deepseek-v4-flash:
      input_per_mtok: 1.50
      output_per_mtok: 6.00

embeddings:
  provider: local_sentence_transformers
  model: all-MiniLM-L6-v2
  models_dir: data/models
  batch_size: 64

cache:
  exact_match: true
  sim_threshold: 0.86
  tune_fraction: 0.5
  tune_seed: 20260908

router:
  heuristic:
    # Cue words that signal the request content needs reasoning. "explain" is
    # deliberately absent: every workload request begins with the fixed wrapper
    # "Explain this statement: ...", so the word carries no information here and
    # including it would send every request to the expensive model. Features are
    # chosen from content cues, not the wrapper.
    max_chars: 240
    reasoning_cues:
      - why
      - compare
      - steps
      - reason
      - because
      - how
      - solve
      - calculate
      - difference
      - prove
      - justify
  cascade_escalation_words:
    - not sure
    - uncertain
    - cannot
    - can't

workload:
  request_template: 'Explain this statement: "{sentence}"'
  n_per_fraction: 500
  seed: 20260908
  duplicate_fractions:
    - name: low
      exact: 0.10
      paraphrase: 0.15
      trap: 0.05
      novel: 0.70
    - name: high
      exact: 0.30
      paraphrase: 0.30
      trap: 0.05
      novel: 0.35

judge:
  rubric: |
    You are scoring whether ANSWER_B answers the same REQUEST as correctly and
    equivalently as ANSWER_A (the reference answer from a stronger model).
    A cache or cheap model must not change the meaning of the answer.
    Score 2 if ANSWER_B is equivalent in meaning and correctness to ANSWER_A.
    Score 1 if ANSWER_B is partially correct, partial, or loses some meaning.
    Score 0 if ANSWER_B is wrong, unrelated, or changes the meaning.
    Reply with exactly one integer: 0, 1, or 2.
  temperature: 0.0
  max_tokens: 1200
  second_judge_sample: 60
  sample_seed: 7

data:
  raw_dir: data/raw
  cache_dir: data/cache
  models_dir: data/models
  runs_dir: data/runs
  primary_results: results.json
  archive_dir: archive
