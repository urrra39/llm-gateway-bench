[project]
name = "llm-gateway-bench"
version = "0.1.0"
description = "An LLM gateway with semantic caching and model routing, measured: how much does a cache-plus-router actually save, and what does it cost in quality?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "urrra39" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lgb"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH", "C4"]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "torch.*",
    "transformers.*",
    "sentence_transformers.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs model weights or network, skipped in CI",
]
